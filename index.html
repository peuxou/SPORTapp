<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mon App Sport</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sport">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #34c759;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --push-color: #ff3b30;
            --pull-color: #34c759;
            --legs-color: #007aff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-top: 20px;
            padding-bottom: 90px;
            user-select: none;
        }
        h1, h2, h3 { margin-top: 0; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* Barre d'onglets de navigation */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: #1c1c1e;
            border-top: 1px solid #2c2c2e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            width: 50%;
        }
        .tab-item.active { color: var(--accent-color); }
        .tab-icon { font-size: 22px; margin-bottom: 3px; }

        /* Boutons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
            cursor: pointer;
            text-align: center;
        }
        .btn-secondary { background-color: #333; color: var(--text-color); }
        .btn-danger { background-color: #ff3b30; color: white; }
        
        /* Calendrier Interactif */
        .calendar-box { background-color: var(--card-bg); border-radius: 14px; padding: 15px; margin-bottom: 20px; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-btn { background: #2c2c2e; border: none; color: white; padding: 6px 12px; border-radius: 8px; font-size: 16px; font-weight: bold; }
        .calendar-header { font-weight: bold; text-transform: capitalize; color: white; font-size: 16px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; font-size: 12px; }
        .calendar-day-name { color: var(--text-secondary); font-weight: bold; padding-bottom: 5px; }
        .calendar-day { padding: 8px 0; border-radius: 50%; position: relative; font-weight: 500; cursor: pointer; }
        .day-workout { font-weight: bold; color: #000 !important; }
        .day-PUSH { background-color: var(--push-color); }
        .day-PULL { background-color: var(--pull-color); }
        .day-LEGS { background-color: var(--legs-color); }
        .day-selected { border: 2px solid #ffffff !important; box-sizing: border-box; }

        /* Cartes d'exercices */
        .exo-card { background-color: var(--card-bg); border-radius: 14px; padding: 15px; margin-bottom: 20px; }
        .exo-title { font-size: 18px; font-weight: bold; margin-bottom: 4px; color: var(--accent-color); }
        .exo-lasttime { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; font-style: italic; }
        .series-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .series-label { font-size: 16px; width: 60px; }
        .inputs-group { display: flex; gap: 10px; }
        input { background-color: #2c2c2e; border: 1px solid #48484a; color: white; padding: 8px; border-radius: 8px; width: 60px; text-align: center; font-size: 16px; }
        
        /* Historique */
        .hist-item { background-color: var(--card-bg); border-radius: 14px; padding: 15px; margin-bottom: 15px; font-size: 14px; }
        .hist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #2c2c2e; padding-bottom: 6px; }
        .hist-date { font-weight: bold; color: var(--text-color); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; color: #000; }
        .badge-PUSH { background-color: var(--push-color); }
        .badge-PULL { background-color: var(--pull-color); }
        .badge-LEGS { background-color: var(--legs-color); }
        .btn-delete { background: none; border: none; color: #ff3b30; font-size: 18px; cursor: pointer; }

        select { width: 100%; background-color: var(--card-bg); color: white; border: 1px solid #48484a; padding: 12px; font-size: 16px; border-radius: 12px; margin-bottom: 20px; }
        .chart-container { background-color: var(--card-bg); border-radius: 14px; padding: 15px; margin-top: 10px; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <!-- ================= ONGLET SÉANCES ================= -->
    <div id="tab-content-workouts" class="tab-page">
        <div id="screen-home" class="screen active">
            <h1 style="font-size: 26px; margin-bottom: 20px; margin-top: 20px;">Mon Suivi Sport</h1>
            
            <button class="btn" onclick="openWorkoutSelector()">🏋️‍♂️ Nouvelle Séance</button>
            
            <!-- CALENDRIER INTERACTIF -->
            <div class="calendar-box">
                <div class="calendar-nav">
                    <button class="calendar-btn" onclick="changeMonth(-1)">◀</button>
                    <div class="calendar-header" id="calendar-month-year"></div>
                    <button class="calendar-btn" onclick="changeMonth(1)">▶</button>
                </div>
                <div class="calendar-grid" id="calendar-grid-container"></div>
            </div>
            
            <h2 id="history-section-title" style="font-size: 18px; color: var(--text-secondary); margin-bottom: 10px;">Historique des séances</h2>
            <div id="history-container"></div>
        </div>

        <div id="screen-type" class="screen">
            <h2 style="margin-top: 20px;">Quelle séance aujourd'hui ?</h2>
            <button class="btn" style="background-color: var(--push-color); color: white;" onclick="startWorkout('PUSH')">🔴 PUSH (Pecs / Épaules / Tri)</button>
            <button class="btn" style="background-color: var(--pull-color); color: black;" onclick="startWorkout('PULL')">🟢 PULL (Dos / Biceps)</button>
            <button class="btn" style="background-color: var(--legs-color); color: white;" onclick="startWorkout('LEGS')">🔵 LEGS (Cuisses / Cardio)</button>
            <button class="btn btn-secondary" onclick="closeWorkoutSelector()">Retour</button>
        </div>

        <div id="screen-workout" class="screen">
            <h2 id="workout-title" style="margin-top: 20px;">Séance</h2>
            <div id="exercises-container"></div>
            <button class="btn" onclick="saveWorkout()">✅ Valider la séance</button>
            <button class="btn btn-secondary btn-danger" onclick="cancelWorkout()">Annuler la séance</button>
        </div>
    </div>

    <!-- ================= ONGLET PROGRESSION ================= -->
    <div id="tab-content-stats" class="tab-page" style="display: none;">
        <h1 style="font-size: 26px; margin-bottom: 20px; margin-top: 20px;">Ma Progression</h1>
        <label style="color: var(--text-secondary); font-size: 14px; display:block; margin-bottom: 8px;">Choisir un exercice :</label>
        <select id="exercise-select" onchange="updateChart()">
            <!-- Rempli dynamiquement -->
        </select>

        <div class="chart-container" id="chart-box">
            <h3 id="chart-title" style="font-size: 16px; margin-bottom: 15px; color: var(--accent-color);">Évolution des charges</h3>
            <canvas id="progressionChart" width="320" height="220" style="width: 100%; max-width: 350px;"></canvas>
        </div>
        
        <div id="stats-empty-msg" style="color: var(--text-secondary); text-align: center; font-style: italic; margin-top: 30px; display: none;">
            Enregistrez au moins deux séances avec cet exercice pour voir la courbe.
        </div>
    </div>

    <!-- BARRE D'ONGLETS FIXE EN BAS -->
    <div class="tab-bar" id="main-tab-bar">
        <button class="tab-item active" id="tab-btn-workouts" onclick="switchTab('workouts')">
            <span class="tab-icon">🏋️‍♂️</span>
            <span>Séances</span>
        </button>
        <button class="tab-item" id="tab-btn-stats" onclick="switchTab('stats')">
            <span class="tab-icon">📈</span>
            <span>Progression</span>
        </button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        const programs = {
            PUSH: ["Machine Push (Pecs)", "Machine inclinée (Haut Pecs)", "Machine Épaules", "Élévations latérales", "Poulie Triceps (Exo 1)", "Poulie Triceps (Exo 2)"],
            PULL: ["Tractions", "Tirage vertical", "Tirage horizontal", "Oiseau ou Rowing sur banc", "Poulie Biceps (Barre droite)", "Poulie Biceps (Corde)"],
            LEGS: ["Machine Quadriceps", "Presse Horizontale", "Vélo d'intérieur", "Tapis de course"]
        };

        let currentType = '';
        let currentCalendarDate = new Date(); // Date de navigation du calendrier
        let selectedDayKey = null; // Jour cliqué pour filtrer l'historique

        function switchTab(tabId) {
            document.querySelectorAll('.tab-page').forEach(page => page.style.display = 'none');
            document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
            
            if (tabId === 'workouts') {
                document.getElementById('tab-content-workouts').style.display = 'block';
                document.getElementById('tab-btn-workouts').classList.add('active');
                selectedDayKey = null; // Reset filtre
                showScreen('screen-home');
            } else if (tabId === 'stats') {
                document.getElementById('tab-content-stats').style.display = 'block';
                document.getElementById('tab-btn-stats').classList.add('active');
                populateExerciseSelect();
                updateChart();
            }
        }

        function openWorkoutSelector() {
            document.getElementById('main-tab-bar').style.display = 'none';
            showScreen('screen-type');
        }
        function closeWorkoutSelector() {
            document.getElementById('main-tab-bar').style.display = 'flex';
            showScreen('screen-home');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'screen-home') {
                loadHistory();
                generateCalendar();
            }
            window.scrollTo(0,0);
        }

        // --- RECHERCHE DES CHARGES PRÉCÉDENTES ---
        function getLastWorkoutData(type) {
            const history = JSON.parse(localStorage.getItem('workout_history')) || [];
            // Trouve la première (donc la plus récente) séance de ce type
            return history.find(w => w.type === type);
        }

        function startWorkout(type) {
            currentType = type;
            document.getElementById('workout-title').innerText = `Séance ${type}`;
            const container = document.getElementById('exercises-container');
            container.innerHTML = '';

            const lastWorkout = getLastWorkoutData(type);

            programs[type].forEach((exo, exoIdx) => {
                let card = document.createElement('div');
                card.className = 'exo-card';
                
                // Chercher si cet exercice précis existe dans la dernière séance
                let lastExoInfo = "";
                if (lastWorkout) {
                    let foundExo = lastWorkout.exercises.find(e => e.name === exo);
                    if (foundExo && foundExo.series.length > 0) {
                        let seriesText = foundExo.series.map(s => `S${s.s}: ${s.w}kg x ${s.r}`).join(' | ');
                        lastExoInfo = `<div class="exo-lasttime">Dernière fois ➔ ${seriesText}</div>`;
                    } else {
                        lastExoInfo = `<div class="exo-lasttime">Pas de données récentes</div>`;
                    }
                } else {
                    lastExoInfo = `<div class="exo-lasttime">Première fois que vous faites cette séance !</div>`;
                }

                card.innerHTML = `
                    <div class="exo-title">${exo}</div>
                    ${lastExoInfo}
                `;
                
                for (let s = 1; s <= 4; s++) {
                    card.innerHTML += `
                        <div class="series-row">
                            <div class="series-label">Série ${s}</div>
                            <div class="inputs-group">
                                <input type="number" pattern="[0-9]*" id="${type}-${exoIdx}-s${s}-w" placeholder="kg">
                                <input type="number" pattern="[0-9]*" id="${type}-${exoIdx}-s${s}-r" placeholder="reps">
                            </div>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
            showScreen('screen-workout');
        }

        function saveWorkout() {
            const now = new Date();
            let workoutData = {
                id: now.getTime(),
                type: currentType,
                dateString: now.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }),
                timestamp: now.getTime(),
                calendarKey: `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`,
                exercises: []
            };

            programs[currentType].forEach((exo, exoIdx) => {
                let exoResult = { name: exo, series: [] };
                for (let s = 1; s <= 4; s++) {
                    let weight = document.getElementById(`${currentType}-${exoIdx}-s${s}-w`).value;
                    let reps = document.getElementById(`${currentType}-${exoIdx}-s${s}-r`).value;
                    if (weight || reps) {
                        exoResult.series.push({ s, w: parseFloat(weight) || 0, r: parseInt(reps) || 0 });
                    }
                }
                if (exoResult.series.length > 0) {
                    workoutData.exercises.push(exoResult);
                }
            });

            if (workoutData.exercises.length === 0) {
                alert("Vous n'avez rien rempli !");
                return;
            }

            let history = JSON.parse(localStorage.getItem('workout_history')) || [];
            history.unshift(workoutData);
            localStorage.setItem('workout_history', JSON.stringify(history));

            selectedDayKey = null; // Retire le filtre après enregistrement
            document.getElementById('main-tab-bar').style.display = 'flex';
            showScreen('screen-home');
        }

        function cancelWorkout() {
            if (confirm("Annuler la séance en cours ?")) {
                document.getElementById('main-tab-bar').style.display = 'flex';
                showScreen('screen-home');
            }
        }

        function deleteWorkout(id) {
            if (confirm("Supprimer définitivement cette séance ?")) {
                let history = JSON.parse(localStorage.getItem('workout_history')) || [];
                history = history.filter(workout => workout.id !== id);
                localStorage.setItem('workout_history', JSON.stringify(history));
                loadHistory();
                generateCalendar();
            }
        }

        function loadHistory() {
            const container = document.getElementById('history-container');
            const sectionTitle = document.getElementById('history-section-title');
            container.innerHTML = '';
            let history = JSON.parse(localStorage.getItem('workout_history')) || [];

            // Appliquer le filtre si un jour du calendrier est sélectionné
            if (selectedDayKey) {
                history = history.filter(workout => workout.calendarKey === selectedDayKey);
                sectionTitle.innerHTML = `Séance(s) du jour sélectionné <button onclick="resetHistoryFilter()" style="background:none; border:none; color:var(--accent-color); font-size:13px; text-decoration:underline; margin-left:10px; cursor:pointer;">(Voir tout)</button>`;
            } else {
                sectionTitle.innerText = "Historique des séances";
            }

            if (history.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); font-style: italic;">Aucune séance enregistrée pour cette période.</p>';
                return;
            }

            history.forEach(workout => {
                let item = document.createElement('div');
                item.className = 'hist-item';
                
                let html = `
                    <div class="hist-header">
                        <span class="badge badge-${workout.type}">${workout.type}</span>
                        <div class="hist-date">${workout.dateString}</div>
                        <button class="btn-delete" onclick="deleteWorkout(${workout.id})">🗑️</button>
                    </div>
                `;
                
                workout.exercises.forEach(exo => {
                    let seriesText = exo.series.map(s => `${s.w}kg x ${s.r}`).join(' | ');
                    html += `<div style="margin-top:6px;">• <strong>${exo.name}</strong> : <span style="color:var(--accent-color)">${seriesText}</span></div>`;
                });
                item.innerHTML = html;
                container.appendChild(item);
            });
        }

        // --- GESTION INTERACTIVE DU CALENDRIER ---
        function changeMonth(direction) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
            generateCalendar();
        }

        function selectDay(dayKey) {
            if (selectedDayKey === dayKey) {
                selectedDayKey = null; // Unclick pour désélectionner
            } else {
                selectedDayKey = dayKey;
            }
            generateCalendar();
            loadHistory();
        }

        function resetHistoryFilter() {
            selectedDayKey = null;
            generateCalendar();
            loadHistory();
        }

        function generateCalendar() {
            const container = document.getElementById('calendar-grid-container');
            const monthYearLabel = document.getElementById('calendar-month-year');
            container.innerHTML = '';

            let history = JSON.parse(localStorage.getItem('workout_history')) || [];
            let workoutMap = {};
            history.forEach(w => { if(w.calendarKey) workoutMap[w.calendarKey] = w.type; });

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const today = new Date();

            monthYearLabel.innerText = currentCalendarDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            const dayNames = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
            dayNames.forEach(name => {
                let dName = document.createElement('div');
                dName.className = 'calendar-day-name'; dName.innerText = name; container.appendChild(dName);
            });

            for (let i = 0; i < firstDayIndex; i++) { container.appendChild(document.createElement('div')); }

            for (let day = 1; day <= daysInMonth; day++) {
                let dayCell = document.createElement('div');
                dayCell.className = 'calendar-day'; dayCell.innerText = day;
                let key = `${year}-${month}-${day}`;
                
                // Coloriage si une séance existe
                if (workoutMap[key]) { 
                    dayCell.classList.add('day-workout', `day-${workoutMap[key]}`); 
                }
                
                // Bordure verte pour aujourd'hui
                if(day === today.getDate() && month === today.getMonth() && year === today.getFullYear() && !workoutMap[key]) { 
                    dayCell.style.border = '1px solid var(--accent-color)'; 
                }

                // Bordure blanche épaisse si ce jour précis est sélectionné par l'utilisateur
                if (selectedDayKey === key) {
                    dayCell.classList.add('day-selected');
                }

                // Clic pour filtrer les séances
                dayCell.onclick = () => selectDay(key);

                container.appendChild(dayCell);
            }
        }

        // --- PROGRESSION & GRAPHIQUE ---
        function populateExerciseSelect() {
            const select = document.getElementById('exercise-select');
            if (select.children.length > 0) return;

            Object.keys(programs).forEach(progName => {
                let group = document.createElement('optgroup');
                group.label = progName;
                programs[progName].forEach(exo => {
                    let opt = document.createElement('option');
                    opt.value = exo; opt.innerText = exo;
                    group.appendChild(opt);
                });
                select.appendChild(group);
            });
        }

        function updateChart() {
            const select = document.getElementById('exercise-select');
            const selectedExo = select.value;
            if(!selectedExo) return;

            const history = JSON.parse(localStorage.getItem('workout_history')) || [];
            let chartData = [];
            
            [...history].reverse().forEach(workout => {
                let foundExo = workout.exercises.find(e => e.name === selectedExo);
                if (foundExo) {
                    let maxWeight = 0;
                    foundExo.series.forEach(s => { if(s.w > maxWeight) maxWeight = s.w; });
                    if(maxWeight > 0) {
                        chartData.push({ date: workout.dateString, weight: maxWeight });
                    }
                }
            });

            const canvas = document.getElementById('progressionChart');
            const chartBox = document.getElementById('chart-box');
            const emptyMsg = document.getElementById('stats-empty-msg');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (chartData.length < 2) {
                emptyMsg.style.display = 'block';
                chartBox.style.display = 'none';
                return;
            }

            emptyMsg.style.display = 'none';
            chartBox.style.display = 'flex';

            const padding = 40;
            const chartWidth = canvas.width - padding * 2;
            const chartHeight = canvas.height - padding * 2;

            let weights = chartData.map(d => d.weight);
            let minW = Math.min(...weights) - 5; if(minW < 0) minW = 0;
            let maxW = Math.max(...weights) + 5;
            let wRange = maxW - minW;
            if(wRange === 0) wRange = 10;

            ctx.strokeStyle = '#2c2c2e'; ctx.lineWidth = 1; ctx.fillStyle = '#aaaaaa'; ctx.font = '10px -apple-system'; ctx.textAlign = 'right';

            for(let i=0; i<=3; i++) {
                let currW = Math.round(minW + (wRange / 3) * i);
                let y = canvas.height - padding - (chartHeight / 3) * i;
                ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(canvas.width - padding, y); ctx.stroke();
                ctx.fillText(`${currW}kg`, padding - 8, y + 3);
            }

            ctx.strokeStyle = '#34c759'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();

            let points = [];
            chartData.forEach((d, idx) => {
                let x = padding + (chartWidth / (chartData.length - 1)) * idx;
                let y = canvas.height - padding - ((d.weight - minW) / wRange) * chartHeight;
                points.push({x, y, date: d.date});
                if(idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            points.forEach((p, idx) => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fillStyle = '#34c759'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                if(idx === 0 || idx === points.length - 1 || (points.length > 2 && idx === Math.floor(points.length / 2))) {
                    ctx.fillStyle = '#aaaaaa'; ctx.textAlign = 'center'; ctx.fillText(p.date, p.x, canvas.height - 12);
                }
            });
        }

        loadHistory();
        generateCalendar();
    </script>
</body>
</html>
