<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mon App Sport</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sport">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --input-bg: #2c2c2e;
            --accent-color: #ff4500; /* Orange Énergie Sport */
            --text-color: #ffffff;
            --text-secondary: #8e8e93;
            --push-color: #ff3b30;
            --pull-color: #ff9500;
            --legs-color: #007aff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Roboto, Helvetica, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-top: 30px;
            padding-bottom: 95px;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 { font-weight: 700; letter-spacing: -0.5px; margin-top: 0; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* Barre d'onglets premium */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid #2c2c2e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            background: none;
            border: none;
            width: 50%;
            transition: color 0.2s ease;
        }
        .tab-item.active { color: var(--accent-color); }
        .tab-icon { font-size: 20px; margin-bottom: 4px; }

        /* Boutons Style Apple Fitness */
        .btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(255, 69, 0, 0.2);
            transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background-color: #2c2c2e; color: var(--text-color); box-shadow: none; }
        .btn-danger { background-color: #ff3b30; color: white; box-shadow: none; }
        
        /* Calendrier Style Fitness Tracker */
        .calendar-box { background-color: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 25px; border: 1px solid #2c2c2e; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-btn { background: #2c2c2e; border: none; color: white; padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: bold; }
        .calendar-header { font-weight: 700; text-transform: capitalize; color: white; font-size: 17px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; font-size: 12px; }
        .calendar-day-name { color: var(--text-secondary); font-weight: 600; padding-bottom: 5px; }
        .calendar-day { padding: 8px 0; border-radius: 50%; position: relative; font-weight: 600; color: #ffffff; }
        .day-workout { font-weight: 700; color: #ffffff !important; }
        .day-PUSH { background-color: var(--push-color); }
        .day-PULL { background-color: var(--pull-color); }
        .day-LEGS { background-color: var(--legs-color); }
        .day-selected { border: 2px solid #ffffff !important; box-sizing: border-box; }

        /* Cartes d'exercices épurées */
        .exo-card { background-color: var(--card-bg); border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
        .exo-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; color: #ffffff; letter-spacing: -0.3px; }
        .exo-lasttime { font-size: 12px; color: var(--text-secondary); margin-bottom: 15px; background: rgba(255,255,255,0.04); padding: 6px 10px; border-radius: 8px; }
        .series-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .series-label { font-size: 14px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .inputs-group { display: flex; gap: 12px; }
        
        /* Inputs Typographie Sport */
        input { 
            background-color: var(--input-bg); 
            border: 1px solid #3a3a3c; 
            color: #ffffff; 
            padding: 10px; 
            border-radius: 10px; 
            width: 65px; 
            text-align: center; 
            font-size: 16px; 
            font-weight: 700; 
            font-family: -apple-system-font, BlinkMacSystemFont, monospace; /* Style compteur */
        }
        input:focus { border-color: var(--accent-color); outline: none; }
        input::placeholder { color: #48484a; }
        
        /* Historique des séances */
        .hist-item { background-color: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #2c2c2e; }
        .hist-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #2c2c2e; padding-bottom: 8px; }
        .hist-date { font-weight: 600; color: #ffffff; font-size: 15px; }
        .badge { padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-PUSH { background-color: var(--push-color); }
        .badge-PULL { background-color: var(--pull-color); }
        .badge-LEGS { background-color: var(--legs-color); }
        .btn-delete { background: none; border: none; color: #ff3b30; font-size: 16px; cursor: pointer; opacity: 0.6; }
        .btn-delete:active { opacity: 1; }

        /* Menu déroulant & Conteneur Graphique */
        select { width: 100%; background-color: var(--card-bg); color: white; border: 1px solid #2c2c2e; padding: 14px; font-size: 16px; font-weight: 600; border-radius: 14px; margin-bottom: 25px; -webkit-appearance: none; }
        .chart-container { background-color: var(--card-bg); border-radius: 16px; padding: 16px; margin-top: 10px; border: 1px solid #2c2c2e; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <!-- ================= ONGLET SÉANCES ================= -->
    <div id="tab-content-workouts" class="tab-page">
        <div id="screen-home" class="screen active">
            <h1 style="font-size: 28px; margin-bottom: 20px; margin-top: 10px;">Entraînement</h1>
            
            <button class="btn" onclick="openWorkoutSelector()">🏋️‍♂️ NOUVELLE SÉANCE</button>
            
            <div class="calendar-box">
                <div class="calendar-nav">
                    <button class="calendar-btn" onclick="changeMonth(-1)">◀</button>
                    <div class="calendar-header" id="calendar-month-year"></div>
                    <button class="calendar-btn" onclick="changeMonth(1)">▶</button>
                </div>
                <div class="calendar-grid" id="calendar-grid-container"></div>
            </div>
            
            <h2 id="history-section-title" style="font-size: 18px; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;">Historique récent</h2>
            <div id="history-container"></div>
        </div>

        <div id="screen-type" class="screen">
            <h2 style="margin-top: 10px; font-size: 24px;">Focus du jour</h2>
            <button class="btn" style="background-color: var(--push-color);" onclick="startWorkout('PUSH')">🔴 PUSH (Pecs / Épaules / Tri)</button>
            <button class="btn" style="background-color: var(--pull-color);" onclick="startWorkout('PULL')">🟠 PULL (Dos / Biceps)</button>
            <button class="btn" style="background-color: var(--legs-color);" onclick="startWorkout('LEGS')">🔵 LEGS (Cuisses / Cardio)</button>
            <button class="btn btn-secondary" onclick="closeWorkoutSelector()">ANNULER</button>
        </div>

        <div id="screen-workout" class="screen">
            <h2 id="workout-title" style="margin-top: 10px; font-size: 24px;">Séance</h2>
            <div id="exercises-container"></div>
            <button class="btn" onclick="saveWorkout()">✅ TERMINER LA SÉANCE</button>
            <button class="btn btn-secondary btn-danger" onclick="cancelWorkout()">ABANDONNER</button>
        </div>
    </div>

    <!-- ================= ONGLET PROGRESSION ================= -->
    <div id="tab-content-stats" class="tab-page" style="display: none;">
        <h1 style="font-size: 28px; margin-bottom: 20px; margin-top: 10px;">Progression</h1>
        <select id="exercise-select" onchange="updateChart()">
            <!-- Rempli dynamiquement -->
        </select>

        <div class="chart-container" id="chart-box">
            <h3 id="chart-title" style="font-size: 14px; margin-bottom: 15px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 0.5px;">Volume Max (kg)</h3>
            <canvas id="progressionChart" width="320" height="220" style="width: 100%; max-width: 350px;"></canvas>
        </div>
        
        <div id="stats-empty-msg" style="color: var(--text-secondary); text-align: center; font-style: italic; margin-top: 30px; display: none;">
            Enregistrez au moins deux séances avec cet exercice pour voir la courbe.
        </div>
    </div>

    <!-- BARRE D'ONGLETS FIXE EN BAS -->
    <div class="tab-bar" id="main-tab-bar">
        <button class="tab-item active" id="tab-btn-workouts" onclick="switchTab('workouts')">
            <span class="tab-icon">🏋️‍♂️</span>
            <span>Séances</span>
        </button>
        <button class="tab-item" id="tab-btn-stats" onclick="switchTab('stats')">
            <span class="tab-icon">📈</span>
            <span>Suivi</span>
        </button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        const programs = {
            PUSH: ["Machine Push (Pecs)", "Machine inclinée (Haut Pecs)", "Machine Épaules", "Élévations latérales", "Poulie Triceps (Exo 1)", "Poulie Triceps (Exo 2)"],
            PULL: ["Tractions", "Tirage vertical", "Tirage horizontal", "Oiseau ou Rowing sur banc", "Poulie Biceps (Barre droite)", "Poulie Biceps (Corde)"],
            LEGS: ["Machine Quadriceps", "Presse Horizontale", "Vélo d'intérieur", "Tapis de course"]
        };

        let currentType = '';
        let currentCalendarDate = new Date();
        let selectedDayKey = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-page').forEach(page => page.style.display = 'none');
            document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
            
            if (tabId === 'workouts') {
                document.getElementById('tab-content-workouts').style.display = 'block';
                document.getElementById('tab-btn-workouts').classList.add('active');
                selectedDayKey = null;
                showScreen('screen-home');
            } else if (tabId === 'stats') {
                document.getElementById('tab-content-stats').style.display = 'block';
                document.getElementById('tab-btn-stats').classList.add('active');
                populateExerciseSelect();
                updateChart();
            }
        }

        function openWorkoutSelector() {
            document.getElementById('main-tab-bar').style.display = 'none';
            showScreen('screen-type');
        }
        function closeWorkoutSelector() {
            document.getElementById('main-tab-bar').style.display = 'flex';
            showScreen('screen-home');
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'screen-home') {
                loadHistory();
                generateCalendar();
            }
            window.scrollTo(0,0);
        }

        function getLastWorkoutData(type) {
            const history = JSON.parse(localStorage.getItem('workout_history')) || [];
            return history.find(w => w.type === type);
        }

        function startWorkout(type) {
            currentType = type;
            document.getElementById('workout-title').innerText = `Séance ${type}`;
            const container = document.getElementById('exercises-container');
            container.innerHTML = '';

            const lastWorkout = getLastWorkoutData(type);

            programs[type].forEach((exo, exoIdx) => {
                let card = document.createElement('div');
                card.className = 'exo-card';
                
                let lastExoInfo = "";
                if (lastWorkout) {
                    let foundExo = lastWorkout.exercises.find(e => e.name === exo);
                    if (foundExo && foundExo.series.length > 0) {
                        let seriesText = foundExo.series.map(s => `S${s.s}: ${s.w}kg x ${s.r}`).join(' | ');
                        lastExoInfo = `<div class="exo-lasttime">Dernier bloc ➔ ${seriesText}</div>`;
                    } else {
                        lastExoInfo = `<div class="exo-lasttime">Aucun historique récent</div>`;
                    }
                } else {
                    lastExoInfo = `<div class="exo-lasttime">Première session enregistrée</div>`;
                }

                card.innerHTML = `
                    <div class="exo-title">${exo}</div>
                    ${lastExoInfo}
                `;
                
                for (let s = 1; s <= 4; s++) {
                    card.innerHTML += `
                        <div class="series-row">
                            <div class="series-label">Série ${s}</div>
                            <div class="inputs-group">
                                <input type="number" pattern="[0-9]*" id="${type}-${exoIdx}-s${s}-w" placeholder="kg">
                                <input type="number" pattern="[0-9]*" id="${type}-${exoIdx}-s${s}-r" placeholder="reps">
                            </div>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
            showScreen('screen-workout');
        }

        function saveWorkout() {
            const now = new Date();
            let workoutData = {
                id: now.getTime(),
                type: currentType,
                dateString: now.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }),
                timestamp: now.getTime(),
                calendarKey: `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`,
                exercises: []
            };

            programs[currentType].forEach((exo, exoIdx) => {
                let exoResult = { name: exo, series: [] };
                for (let s = 1; s <= 4; s++) {
                    let weight = document.getElementById(`${currentType}-${exoIdx}-s${s}-w`).value;
                    let reps = document.getElementById(`${currentType}-${exoIdx}-s${s}-r`).value;
                    if (weight || reps) {
                        exoResult.series.push({ s, w: parseFloat(weight) || 0, r: parseInt(reps) || 0 });
                    }
                }
                if (exoResult.series.length > 0) {
                    workoutData.exercises.push(exoResult);
                }
            });

            if (workoutData.exercises.length === 0) {
                alert("Séance vide !");
                return;
            }

            let history = JSON.parse(localStorage.getItem('workout_history')) || [];
            history.unshift(workoutData);
            localStorage.setItem('workout_history', JSON.stringify(history));

            selectedDayKey = null;
            document.getElementById('main-tab-bar').style.display = 'flex';
            showScreen('screen-home');
        }

        function cancelWorkout() {
            if (confirm("Abandonner la séance ?")) {
                document.getElementById('main-tab-bar').style.display = 'flex';
                showScreen('screen-home');
            }
        }

        function deleteWorkout(id) {
            if (confirm("Supprimer cette séance ?")) {
                let history = JSON.parse(localStorage.getItem('workout_history')) || [];
                history = history.filter(workout => workout.id !== id);
                localStorage.setItem('workout_history', JSON.stringify(history));
                loadHistory();
                generateCalendar();
            }
        }

        function loadHistory() {
            const container = document.getElementById('history-container');
            const sectionTitle = document.getElementById('history-section-title');
            container.innerHTML = '';
            let history = JSON.parse(localStorage.getItem('workout_history')) || [];

            if (selectedDayKey) {
                history = history.filter(workout => workout.calendarKey === selectedDayKey);
                sectionTitle.innerHTML = `Filtre actif <button onclick="resetHistoryFilter()" style="background:none; border:none; color:var(--accent-color); font-size:12px; text-transform:uppercase; font-weight:700; margin-left:10px; cursor:pointer;">(Effacer)</button>`;
            } else {
                sectionTitle.innerText = "Historique des séances";
            }

            if (history.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); font-style: italic; text-align:center; padding: 20px 0;">Aucune activité.</p>';
                return;
            }

            history.forEach(workout => {
                let item = document.createElement('div');
                item.className = 'hist-item';
                
                let html = `
                    <div class="hist-header">
                        <span class="badge badge-${workout.type}">${workout.type}</span>
                        <div class="hist-date">${workout.dateString}</div>
                        <button class="btn-delete" onclick="deleteWorkout(${workout.id})">🗑️</button>
                    </div>
                `;
                
                workout.exercises.forEach(exo => {
                    let seriesText = exo.series.map(s => `${s.w}kg x ${s.r}`).join(' | ');
                    html += `<div style="margin-top:8px; font-size:14px;"><strong>${exo.name}</strong><br><span style="color:var(--accent-color); font-family:monospace; font-size:13px;">${seriesText}</span></div>`;
                });
                item.innerHTML = html;
                container.appendChild(item);
            });
        }

        function changeMonth(direction) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + direction);
            generateCalendar();
        }

        function selectDay(dayKey) {
            selectedDayKey = (selectedDayKey === dayKey) ? null : dayKey;
            generateCalendar();
            loadHistory();
        }

        function resetHistoryFilter() {
            selectedDayKey = null;
            generateCalendar();
            loadHistory();
        }

        function generateCalendar() {
            const container = document.getElementById('calendar-grid-container');
            const monthYearLabel = document.getElementById('calendar-month-year');
            container.innerHTML = '';

            let history = JSON.parse(localStorage.getItem('workout_history')) || [];
            let workoutMap = {};
            history.forEach(w => { if(w.calendarKey) workoutMap[w.calendarKey] = w.type; });

            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();
            const today = new Date();

            monthYearLabel.innerText = currentCalendarDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let firstDayIndex = new Date(year, month, 1).getDay();
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            const dayNames = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
            dayNames.forEach(name => {
                let dName = document.createElement('div');
                dName.className = 'calendar-day-name'; dName.innerText = name; container.appendChild(dName);
            });

            for (let i = 0; i < firstDayIndex; i++) { container.appendChild(document.createElement('div')); }

            for (let day = 1; day <= daysInMonth; day++) {
                let dayCell = document.createElement('div');
                dayCell.className = 'calendar-day'; dayCell.innerText = day;
                let key = `${year}-${month}-${day}`;
                
                if (workoutMap[key]) { dayCell.classList.add('day-workout', `day-${workoutMap[key]}`); }
                if(day === today.getDate() && month === today.getMonth() && year === today.getFullYear() && !workoutMap[key]) { dayCell.style.border = '1px solid var(--accent-color)'; }
                if (selectedDayKey === key) { dayCell.classList.add('day-selected'); }

                dayCell.onclick = () => selectDay(key);
                container.appendChild(dayCell);
            }
        }

        function populateExerciseSelect() {
            const select = document.getElementById('exercise-select');
            if (select.children.length > 0) return;

            Object.keys(programs).forEach(progName => {
                let group = document.createElement('optgroup');
                group.label = progName;
                programs[progName].forEach(exo => {
                    let opt = document.createElement('option');
                    opt.value = exo; opt.innerText = exo;
                    group.appendChild(opt);
                });
                select.appendChild(group);
            });
        }

        function updateChart() {
            const select = document.getElementById('exercise-select');
            const selectedExo = select.value;
            if(!selectedExo) return;

            const history = JSON.parse(localStorage.getItem('workout_history')) || [];
            let chartData = [];
            
            [...history].reverse().forEach(workout => {
                let foundExo = workout.exercises.find(e => e.name === selectedExo);
                if (foundExo) {
                    let maxWeight = 0;
                    foundExo.series.forEach(s => { if(s.w > maxWeight) maxWeight = s.w; });
                    if(maxWeight > 0) { chartData.push({ date: workout.dateString, weight: maxWeight }); }
                }
            });

            const canvas = document.getElementById('progressionChart');
            const chartBox = document.getElementById('chart-box');
            const emptyMsg = document.getElementById('stats-empty-msg');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (chartData.length < 2) {
                emptyMsg.style.display = 'block';
                chartBox.style.display = 'none';
                return;
            }

            emptyMsg.style.display = 'none';
            chartBox.style.display = 'flex';

            const padding = 40;
            const chartWidth = canvas.width - padding * 2;
            const chartHeight = canvas.height - padding * 2;

            let weights = chartData.map(d => d.weight);
            let minW = Math.min(...weights) - 5; if(minW < 0) minW = 0;
            let maxW = Math.max(...weights) + 5;
            let wRange = maxW - minW; if(wRange === 0) wRange = 10;

            ctx.strokeStyle = '#2c2c2e'; ctx.lineWidth = 1; ctx.fillStyle = '#8e8e93'; ctx.font = 'bold 10px -apple-system'; ctx.textAlign = 'right';

            for(let i=0; i<=3; i++) {
                let currW = Math.round(minW + (wRange / 3) * i);
                let y = canvas.height - padding - (chartHeight / 3) * i;
                ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(canvas.width - padding, y); ctx.stroke();
                ctx.fillText(`${currW}`, padding - 8, y + 3);
            }

            // Courbe Orange Néon
            ctx.strokeStyle = '#ff4500'; ctx.lineWidth = 3.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();

            let points = [];
            chartData.forEach((d, idx) => {
                let x = padding + (chartWidth / (chartData.length - 1)) * idx;
                let y = canvas.height - padding - ((d.weight - minW) / wRange) * chartHeight;
                points.push({x, y, date: d.date});
                if(idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            points.forEach((p, idx) => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fillStyle = '#ff4500'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
                if(idx === 0 || idx === points.length - 1 || (points.length > 2 && idx === Math.floor(points.length / 2))) {
                    ctx.fillStyle = '#8e8e93'; ctx.textAlign = 'center'; ctx.fillText(p.date, p.x, canvas.height - 12);
                }
            });
        }

        loadHistory();
        generateCalendar();
    </script>
</body>
</html>
