<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mon App Sport</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sport">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #34c759;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-top: 40px;
            user-select: none;
        }
        h1, h2, h3 { margin-top: 0; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* Boutons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
            cursor: pointer;
            text-align: center;
        }
        .btn-secondary {
            background-color: #333;
            color: var(--text-color);
        }
        .btn-danger {
            background-color: #ff3b30;
            color: white;
        }
        
        /* Cartes d'exercices */
        .exo-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .exo-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--accent-color);
        }
        .series-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .series-label { font-size: 16px; width: 60px; }
        .inputs-group {
            display: flex;
            gap: 10px;
        }
        input {
            background-color: #2c2c2e;
            border: 1px solid #48484a;
            color: white;
            padding: 8px;
            border-radius: 8px;
            width: 60px;
            text-align: center;
            font-size: 16px;
        }
        input::placeholder { color: #555; }
        
        /* Historique */
        .hist-item {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .hist-date { font-weight: bold; color: var(--text-secondary); margin-bottom: 5px;}
    </style>
</head>
<body>

    <div id="screen-home" class="screen active">
        <h1 style="font-size: 28px; margin-bottom: 30px;">Mon Suivi Sport</h1>
        <button class="btn" onclick="showScreen('screen-type')">🏋️‍♂️ Nouvelle Séance</button>
        
        <h2 style="margin-top: 40px; font-size: 20px; color: var(--text-secondary);">Historique récent</h2>
        <div id="history-container"></div>
    </div>

    <div id="screen-type" class="screen">
        <h2>Quelle séance aujourd'hui ?</h2>
        <button class="btn" onclick="startWorkout('PUSH')">🔴 PUSH (Pecs / Épaules / Tri)</button>
        <button class="btn" onclick="startWorkout('PULL')">🟢 PULL (Dos / Biceps)</button>
        <button class="btn" onclick="startWorkout('LEGS')">🔵 LEGS (Cuisses / Cardio)</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-home')">Retour</button>
    </div>

    <div id="screen-workout" class="screen">
        <h2 id="workout-title">Séance</h2>
        <div id="exercises-container"></div>
        <button class="btn" onclick="saveWorkout()">✅ Valider la séance</button>
        <button class="btn btn-secondary btn-danger" onclick="cancelWorkout()">Annuler la séance</button>
    </div>

    <script>
        // Enregistrement du Service Worker pour le mode PWA (hors-ligne)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        // Base de données des exercices
        const programs = {
            PUSH: ["Machine Push (Pecs)", "Machine inclinée (Haut Pecs)", "Machine Épaules", "Élévations latérales", "Poulie Triceps (Exo 1)", "Poulie Triceps (Exo 2)"],
            PULL: ["Tractions", "Tirage vertical", "Tirage horizontal", "Oiseau ou Rowing sur banc", "Poulie Biceps (Barre droite)", "Poulie Biceps (Corde)"],
            LEGS: ["Machine Quadriceps", "Presse Horizontale", "Vélo d'intérieur", "Tapis de course"]
        };

        let currentType = '';

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'screen-home') loadHistory();
            window.scrollTo(0,0);
        }

        function startWorkout(type) {
            currentType = type;
            document.getElementById('workout-title').innerText = `Séance ${type}`;
            const container = document.getElementById('exercises-container');
            container.innerHTML = '';

            programs[type].forEach((exo, exoIdx) => {
                let card = document.createElement('div');
                card.className = 'exo-card';
                card.innerHTML = `<div class="exo-title">${exo}</div>`;
                
                // On génère par défaut 4 séries par exercice
                for (let s = 1; s <= 4; s++) {
                    card.innerHTML += `
                        <div class="series-row">
                            <div class="series-label">Série ${s}</div>
                            <div class="inputs-group">
                                <input type="number" pattern="[0-9]*" id="${type}-${exoIdx}-s${s}-w" placeholder="kg">
                                <input type="number" pattern="[0-9]*" id="${type}-${exoIdx}-s${s}-r" placeholder="reps">
                            </div>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
            showScreen('screen-workout');
        }

        function saveWorkout() {
            let workoutData = {
                type: currentType,
                date: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' }),
                exercises: []
            };

            programs[currentType].forEach((exo, exoIdx) => {
                let exoResult = { name: exo, series: [] };
                for (let s = 1; s <= 4; s++) {
                    let weight = document.getElementById(`${currentType}-${exoIdx}-s${s}-w`).value;
                    let reps = document.getElementById(`${currentType}-${exoIdx}-s${s}-r`).value;
                    if (weight || reps) {
                        exoResult.series.push({ s, w: weight || 0, r: reps || 0 });
                    }
                }
                if (exoResult.series.length > 0) {
                    workoutData.exercises.push(exoResult);
                }
            });

            if (workoutData.exercises.length === 0) {
                alert("Vous n'avez rien rempli !");
                return;
            }

            let history = JSON.parse(localStorage.getItem('workout_history')) || [];
            history.unshift(workoutData); // Ajoute au début
            localStorage.setItem('workout_history', JSON.stringify(history));

            showScreen('screen-home');
        }

        function cancelWorkout() {
            if (confirm("Annuler la séance en cours ? Les données seront perdues.")) {
                showScreen('screen-home');
            }
        }

        function loadHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';
            let history = JSON.parse(localStorage.getItem('workout_history')) || [];

            if (history.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); font-style: italic;">Aucune séance enregistrée pour le moment.</p>';
                return;
            }

            // Affiche les 5 dernières séances
            history.slice(0, 5).forEach(workout => {
                let item = document.createElement('div');
                item.className = 'hist-item';
                let html = `<div class="hist-date">${workout.date} - Séance ${workout.type}</div>`;
                
                workout.exercises.forEach(exo => {
                    let seriesText = exo.series.map(s => `${s.w}kg x ${s.r}`).join(' | ');
                    html += `<div style="margin-top:4px;">• <strong>${exo.name}</strong> : <span style="color:#34c759">${seriesText}</span></div>`;
                });
                item.innerHTML = html;
                container.appendChild(item);
            });
        }

        // Charger l'historique au premier démarrage
        loadHistory();
    </script>
</body>
</html>
