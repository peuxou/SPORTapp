<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mon App Sport</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sport">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #34c759;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --push-color: #ff3b30;
            --pull-color: #34c759;
            --legs-color: #007aff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-top: 40px;
            user-select: none;
        }
        h1, h2, h3 { margin-top: 0; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* Boutons */
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
            cursor: pointer;
            text-align: center;
        }
        .btn-secondary {
            background-color: #333;
            color: var(--text-color);
        }
        .btn-danger {
            background-color: #ff3b30;
            color: white;
        }
        
        /* Calendrier */
        .calendar-box {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .calendar-header {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: capitalize;
            color: var(--text-secondary);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-size: 12px;
        }
        .calendar-day-name {
            color: var(--text-secondary);
            font-weight: bold;
            padding-bottom: 5px;
        }
        .calendar-day {
            padding: 8px 0;
            border-radius: 50%;
            position: relative;
            font-weight: 500;
        }
        .day-workout {
            font-weight: bold;
            color: #000 !important;
        }
        .day-PUSH { background-color: var(--push-color); }
        .day-PULL { background-color: var(--pull-color); }
        .day-LEGS { background-color: var(--legs-color); }

        /* Cartes d'exercices */
        .exo-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .exo-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--accent-color);
        }
        .series-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .series-label { font-size: 16px; width: 60px; }
        .inputs-group {
            display: flex;
            gap: 10px;
        }
        input {
            background-color: #2c2c2e;
            border: 1px solid #48484a;
            color: white;
            padding: 8px;
            border-radius: 8px;
            width: 60px;
            text-align: center;
            font-size: 16px;
        }
        input::placeholder { color: #555; }
        
        /* Historique */
        .hist-item {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            position: relative;
        }
        .hist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #2c2c2e;
            padding-bottom: 6px;
        }
        .hist-date { font-weight: bold; color: var(--text-color); }
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            color: #000;
        }
        .badge-PUSH { background-color: var(--push-color); }
        .badge-PULL { background-color: var(--pull-color); }
        .badge-LEGS { background-color: var(--legs-color); }
        .btn-delete {
            background: none;
            border: none;
            color: #ff3b30;
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN ACCUEIL -->
    <div id="screen-home" class="screen active">
        <h1 style="font-size: 26px; margin-bottom: 20px;">Mon Suivi Sport</h1>
        
        <button class="btn" onclick="showScreen('screen-type')">🏋️‍♂️ Nouvelle Séance</button>
        
        <!-- CALENDRIER -->
        <div class="calendar-box">
            <div class="calendar-header" id="calendar-month-year"></div>
            <div class="calendar-grid" id="calendar-grid-container"></div>
        </div>
        
        <h2 style="font-size: 18px; color: var(--text-secondary); margin-bottom: 10px;">Historique des séances</h2>
        <div id="history-container"></div>
    </div>

    <!-- ÉCRAN CHOIX PROGRAMME -->
    <div id="screen-type" class="screen">
        <h2>Quelle séance aujourd'hui ?</h2>
        <button class="btn" style="background-color: var(--push-color); color: white;" onclick="startWorkout('PUSH')">🔴 PUSH (Pecs / Épaules / Tri)</button>
        <button class="btn" style="background-color: var(--pull-color); color: black;" onclick="startWorkout('PULL')">🟢 PULL (Dos / Biceps)</button>
        <button class="btn" style="background-color: var(--legs-color); color: white;" onclick="startWorkout('LEGS')">🔵 LEGS (Cuisses / Cardio)</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-home')">Retour</button>
    </div>

    <!-- ÉCRAN SÉANCE EN COURS -->
    <div id="screen-workout" class="screen">
        <h2 id="workout-title">Séance</h2>
        <div id="exercises-container"></div>
        <button class="btn" onclick="saveWorkout()">✅ Valider la séance</button>
        <button class="btn btn-secondary btn-danger" onclick="cancelWorkout()">Annuler la séance</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        const programs = {
            PUSH: ["Machine Push (Pecs)", "Machine inclinée (Haut Pecs)", "Machine Épaules", "Élévations latérales", "Poulie Triceps (Exo 1)", "Poulie Triceps (Exo 2)"],
            PULL: ["Tractions", "Tirage vertical", "Tirage horizontal", "Oiseau ou Rowing sur banc", "Poulie Biceps (Barre droite)", "Poulie Biceps (Corde)"],
            LEGS: ["Machine Quadriceps", "Presse Horizontale", "Vélo d'intérieur", "Tapis de course"]
        };

        let currentType = '';

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'screen-home') {
                loadHistory();
                generateCalendar();
            }
            window.scrollTo(0,0);
        }

        function startWorkout(type) {
            currentType = type;
            document.getElementById('workout-title').innerText = `Séance ${type}`;
            const container = document.getElementById('exercises-container');
            container.innerHTML = '';

            programs[type].forEach((exo, exoIdx) => {
                let card = document.createElement('div');
                card.className = 'exo-card';
                card.innerHTML = `<div class="exo-title">${exo}</div>`;
                
                for (let s = 1; s <= 4; s++) {
                    card.innerHTML += `
                        <div class="series-row">
                            <div class="series-label">Série ${s}</div>
                            <div class="inputs-group">
                                <input type="number" pattern="[0-9]*" id="${type}-${exoIdx}-s${s}-w" placeholder="kg">
                                <input type="number" pattern="[0-9]*" id="${type}-${exoIdx}-s${s}-r" placeholder="reps">
                            </div>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
            showScreen('screen-workout');
        }

        function saveWorkout() {
            const now = new Date();
            let workoutData = {
                id: now.getTime(), // ID unique pour suppression
                type: currentType,
                dateString: now.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' }),
                calendarKey: `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`, // Clé pour le calendrier
                exercises: []
            };

            programs[currentType].forEach((exo, exoIdx) => {
                let exoResult = { name: exo, series: [] };
                for (let s = 1; s <= 4; s++) {
                    let weight = document.getElementById(`${currentType}-${exoIdx}-s${s}-w`).value;
                    let reps = document.getElementById(`${currentType}-${exoIdx}-s${s}-r`).value;
                    if (weight || reps) {
                        exoResult.series.push({ s, w: weight || 0, r: reps || 0 });
                    }
                }
                if (exoResult.series.length > 0) {
                    workoutData.exercises.push(exoResult);
                }
            });

            if (workoutData.exercises.length === 0) {
                alert("Vous n'avez rien rempli !");
                return;
            }

            let history = JSON.parse(localStorage.getItem('workout_history')) || [];
            history.unshift(workoutData);
            localStorage.setItem('workout_history', JSON.stringify(history));

            showScreen('screen-home');
        }

        function cancelWorkout() {
            if (confirm("Annuler la séance en cours ?")) {
                showScreen('screen-home');
            }
        }

        function deleteWorkout(id) {
            if (confirm("Supprimer définitivement cette séance de l'historique ?")) {
                let history = JSON.parse(localStorage.getItem('workout_history')) || [];
                history = history.filter(workout => workout.id !== id);
                localStorage.setItem('workout_history', JSON.stringify(history));
                loadHistory();
                generateCalendar();
            }
        }

        function loadHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';
            let history = JSON.parse(localStorage.getItem('workout_history')) || [];

            if (history.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); font-style: italic;">Aucune séance enregistrée.</p>';
                return;
            }

            history.forEach(workout => {
                let item = document.createElement('div');
                item.className = 'hist-item';
                
                let html = `
                    <div class="hist-header">
                        <span class="badge badge-${workout.type}">${workout.type}</span>
                        <div class="hist-date">${workout.dateString}</div>
                        <button class="btn-delete" onclick="deleteWorkout(${workout.id})">🗑️</button>
                    </div>
                `;
                
                workout.exercises.forEach(exo => {
                    let seriesText = exo.series.map(s => `${s.w}kg x ${s.r}`).join(' | ');
                    html += `<div style="margin-top:6px;">• <strong>${exo.name}</strong> : <span style="color:var(--accent-color)">${seriesText}</span></div>`;
                });
                item.innerHTML = html;
                container.appendChild(item);
            });
        }

        function generateCalendar() {
            const container = document.getElementById('calendar-grid-container');
            const monthYearLabel = document.getElementById('calendar-month-year');
            container.innerHTML = '';

            let history = JSON.parse(localStorage.getItem('workout_history')) || [];
            // Map pour retrouver rapidement le type de séance par jour
            let workoutMap = {};
            history.forEach(w => {
                if(w.calendarKey) workoutMap[w.calendarKey] = w.type;
            });

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();

            monthYearLabel.innerText = now.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            // Premier jour du mois (0 = Dimanche, 1 = Lundi, etc.)
            let firstDayIndex = new Date(year, month, 1).getDay();
            // Ajustement pour commencer par Lundi (Lundi=0, ..., Dimanche=6)
            firstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

            const dayNames = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
            dayNames.forEach(name => {
                let dName = document.createElement('div');
                dName.className = 'calendar-day-name';
                dName.innerText = name;
                container.appendChild(dName);
            });

            // Cases vides pour le début du mois
            for (let i = 0; i < firstDayIndex; i++) {
                let emptyCell = document.createElement('div');
                container.appendChild(emptyCell);
            }

            // Jours du mois
            for (let day = 1; day <= daysInMonth; day++) {
                let dayCell = document.createElement('div');
                dayCell.className = 'calendar-day';
                dayCell.innerText = day;

                let key = `${year}-${month}-${day}`;
                if (workoutMap[key]) {
                    let type = workoutMap[key];
                    dayCell.classList.add('day-workout', `day-${type}`);
                }
                
                // Mettre en valeur le jour d'aujourd'hui s'il n'y a pas de séance
                if(day === now.getDate() && !workoutMap[key]) {
                    dayCell.style.border = '1px solid var(--accent-color)';
                }

                container.appendChild(dayCell);
            }
        }

        // Initialisation globale
        loadHistory();
        generateCalendar();
    </script>
</body>
</html>
